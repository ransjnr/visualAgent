agent:
  # Capture interval in seconds.
  interval_s: 1.0

  # If true, only analyze when the active window/app changes (reduces CPU).
  analyze_on_window_change_only: false

  # If true, save frames to disk for debugging (privacy risk).
  debug_save_frames: false
  debug_frames_dir: ".agent_frames"
  # If true, print OCR text and rule matching details to terminal.
  debug_ocr: false

privacy:
  # If set, blur out screen regions by rectangle before analysis.
  # Example: [[0,0,400,200]] means x,y,w,h.
  redact_rects: []

vision:
  # OCR language (requires tesseract language packs installed).
  ocr_lang: "eng"

assist:
  # If true, show a small always-on-top overlay with suggestions.
  overlay_enabled: true

  # If false, only log to terminal.
  terminal_output: true

llm:
  # Choose provider: "none" (rules only) or "openai_compatible"
  provider: "none"

  # Used when provider=openai_compatible
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key_env: environ.get("OPENAI_API_KEY")

rules:
  enabled:
    # LLM-powered rule (recommended): dynamically analyzes context and generates intelligent suggestions
    - excel_llm
    # Traditional hardcoded rules (optional, for specific use cases or fallback):
    # - excel_charts          # Chart creation and editing
    # - excel_formulas        # Formulas (SUM, VLOOKUP, IF, etc.)
    # - excel_pivottables     # PivotTable creation and management
    # - excel_data_analysis   # Sorting, filtering, data validation
    # - excel_formatting      # Cell formatting, conditional formatting
    # - excel_import_export   # Import/export data, CSV, PDF

